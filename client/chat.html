<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SkillHub Chat</title>


    <!-- =====================================================
         CHAT STYLE
    ====================================================== -->

    <link rel="stylesheet" href="chat.css">


    <!-- =====================================================
         THEME
    ====================================================== -->

    <link rel="stylesheet" href="theme.css">


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

   <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- =====================================================
         THEME SCRIPT
    ====================================================== -->

    <script src="theme.js" defer></script>

</head>


<body>


<!-- =========================================================
     DASHBOARD LAYOUT
========================================================= -->

<div class="dashboard">


    <!-- =====================================================
         LEFT MAIN SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <!-- Logo -->

        <div class="logo">

            <i class="fa-solid fa-graduation-cap"></i>

            <span>SkillHub</span>

        </div>


        <!-- Navigation -->

        <ul>

            <!-- Dashboard -->

            <li onclick="window.location.href='dashboard.html'">

                <i class="fa-solid fa-house"></i>

                <span>Dashboard</span>

            </li>


            <!-- Browse Skills -->

            <li>

                <a href="browse-skills.html">

                    <i class="fa-solid fa-book"></i>

                    <span>Browse Skills</span>

                </a>

            </li>


            <!-- Requests -->

            <li onclick="window.location.href='request.html'">

                <i class="fa-solid fa-handshake"></i>

                <span>Requests</span>

            </li>


            <!-- Chat -->

            <li class="active">

                <a href="chat.html">

                    <i class="fa-solid fa-comments"></i>

                    <span>Chat</span>

                </a>

            </li>


            <!-- Profile -->

            <li onclick="window.location.href='profile.html'">

                <i class="fa-solid fa-user"></i>

                <span>Profile</span>

            </li>


            <!-- Logout -->

            <li id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>Logout</span>

            </li>

        </ul>

    </aside>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="main">


        <!-- =================================================
             CHAT CONTAINER
        ================================================== -->

        <div class="chat-container">


            <!-- =================================================
                 CHAT LIST SIDEBAR
            ================================================== -->

            <aside class="chat-sidebar">


                <!-- Sidebar Header -->

                <div class="sidebar-header">

                    <h2>

                        <i class="fa-solid fa-comments"></i>

                        Chats

                    </h2>

                </div>


                <!-- Search -->

                <div class="search-box">

                    <i class="fa-solid fa-search"></i>

                    <input
                        type="text"
                        id="searchChat"
                        placeholder="Search conversations..."
                        autocomplete="off">

                </div>


                <!-- Chat List -->

                <div
                    class="chat-list"
                    id="chatList">

                    <!--
                        Chat conversations will be
                        loaded dynamically by chat.js
                    -->

                </div>


            </aside>



            <!-- =================================================
                 RIGHT CHAT SECTION
            ================================================== -->

            <section class="chat-section">


                <!-- =================================================
                     CHAT HEADER

                     Hidden until user selects a chat.
                ================================================== -->

                <div
                    class="chat-header"
                    id="chatHeader"
                    style="display: none;">


                    <div class="header-user">


                        <!-- Avatar -->

                        <div
                            class="avatar"
                            id="chatAvatar">

                            <i class="fa-solid fa-user"></i>

                        </div>


                        <!-- User Information -->

                        <div class="header-info">


                            <!-- Partner Name -->

                            <h3 id="chatUser">

                                Select a Chat

                            </h3>


                            <!-- Skill Exchange -->

                            <span
                                id="chatSkill"
                                class="chat-skill">

                                Skill Exchange

                            </span>


                            <!-- Online Status -->

                            <span
                                id="chatStatus"
                                class="chat-status">

                                Offline

                            </span>


                        </div>


                    </div>


                </div>



                <!-- =================================================
                     CHAT BODY
                ================================================== -->

                <div
                    class="chat-body"
                    id="chatBody">


                    <!-- =================================================
                         INITIAL WELCOME SCREEN

                         This disappears when a chat is selected.
                    ================================================== -->

                    <div class="empty-chat">

                        <i class="fa-solid fa-comments"></i>


                        <h2>

                            Welcome to SkillHub Chat

                        </h2>


                        <p>

                            Select a conversation from the left
                            sidebar to start chatting with your
                            skill partner.

                        </p>

                    </div>


                </div>



                <!-- =================================================
                     EMOJI PICKER
                ================================================== -->

                <div
                    class="emoji-picker"
                    id="emojiPicker">
                   


                    <button
                        type="button"
                        data-emoji="😀">
                        😀
                    </button>


                    <button
                        type="button"
                        data-emoji="😂">
                        😂
                    </button>


                    <button
                        type="button"
                        data-emoji="😊">
                        😊
                    </button>


                    <button
                        type="button"
                        data-emoji="😍">
                        😍
                    </button>


                    <button
                        type="button"
                        data-emoji="🥰">
                        🥰
                    </button>


                    <button
                        type="button"
                        data-emoji="😎">
                        😎
                    </button>


                    <button
                        type="button"
                        data-emoji="👍">
                        👍
                    </button>


                    <button
                        type="button"
                        data-emoji="👏">
                        👏
                    </button>


                    <button
                        type="button"
                        data-emoji="🙌">
                        🙌
                    </button>


                    <button
                        type="button"
                        data-emoji="❤️">
                        ❤️
                    </button>


                    <button
                        type="button"
                        data-emoji="🔥">
                        🔥
                    </button>


                    <button
                        type="button"
                        data-emoji="✨">
                        ✨
                    </button>


                    <button
                        type="button"
                        data-emoji="🎉">
                        🎉
                    </button>


                    <button
                        type="button"
                        data-emoji="💯">
                        💯
                    </button>


                    <button
                        type="button"
                        data-emoji="🤝">
                        🤝
                    </button>


                    <button
                        type="button"
                        data-emoji="💻">
                        💻
                    </button>


                    <button
                        type="button"
                        data-emoji="📚">
                        📚
                    </button>


                    <button
                        type="button"
                        data-emoji="🎯">
                        🎯
                    </button>


                </div>



                <!-- =================================================
                     MESSAGE INPUT
                ================================================== -->

                <div
                    class="chat-input"
                    id="chatInputArea"
                    style="display: none;">


                    <!-- Emoji Button -->

                    <button
                        class="emoji-btn"
                        id="emojiBtn"
                        type="button"
                        title="Add emoji">

                        <i class="fa-regular fa-face-smile"></i>

                    </button>


                    <!-- Message Input -->

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Type a message..."
                        autocomplete="off">


                    <!-- Send Button -->

                    <button
                        class="send-btn"
                        id="sendBtn"
                        type="button"
                        title="Send message">

                        <i class="fa-solid fa-paper-plane"></i>

                    </button>


                </div>


            </section>


        </div>


    </main>


</div>



<!-- =========================================================
     SOCKET.IO
     
     IMPORTANT:
     This must be loaded BEFORE chat.js
========================================================= -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


<!-- =========================================================
     CHAT SCRIPT
========================================================= -->

<script src="chat.js"></script>


<!-- =========================================================
     LOGOUT
========================================================= -->

<script>

    const logoutBtn = document.getElementById("logoutBtn");

    if (logoutBtn) {

        logoutBtn.addEventListener("click", () => {

            localStorage.removeItem("token");

            window.location.href = "index.html";

        });

    }

</script>


</body>

</html>
