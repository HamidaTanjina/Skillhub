            <li onclick="window.location.href='request.html'">

                    <i class="fa-solid fa-circle-user profile-icon"></i>

                </div>

            </div>

        </header>
                <!-- ==========================================
             CHAT AREA
        =========================================== -->

        <div class="chat-container">

            <!-- ===========================
                 LEFT CHAT SIDEBAR
            ============================ -->

            <aside class="chat-sidebar">

                <div class="sidebar-header">

                    <h2>

                        <i class="fa-solid fa-comments"></i>

                        Chats

                    </h2>

                </div>

                <!-- Search -->

                <div class="search-box">

                    <i class="fa-solid fa-search"></i>

                    <input
                        type="text"
                        id="searchChat"
                        placeholder="Search conversations...">

                </div>

                <!-- Chat List -->

                <div
                    class="chat-list"
                    id="chatList">

                    <!-- chat.js loads conversations -->

                </div>

            </aside>


            <!-- ===========================
                 RIGHT CHAT SECTION
            ============================ -->

            <section class="chat-section">

                <!-- Chat Header -->

                <div class="chat-header">

                    <div class="header-user">

                        <div
                            class="avatar"
                            id="chatAvatar">

                            <i class="fa-solid fa-user"></i>

                        </div>

                        <div>

                            <h3 id="chatUser">

                                Select a Chat

                            </h3>

                            <span id="chatStatus">

                                No conversation selected

                            </span>

                        </div>

                    </div>

                </div>


                <!-- Chat Messages -->

                <div
                    class="chat-body"
                    id="chatBody">

                    <div class="empty-chat">

                        <i class="fa-solid fa-comments"></i>

                        <h2>

                            Welcome to SkillHub Chat

                        </h2>

                        <p>

                            Select a conversation from the
                            left sidebar to start messaging.

                        </p>

                    </div>

                </div>


                <!-- Chat Input -->

                <div class="chat-input">

                    <button
                        class="emoji-btn">

                        <i class="fa-regular fa-face-smile"></i>

                    </button>

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Type your message..."
                        disabled>

                    <button
                        class="send-btn"
                        id="sendBtn"
                        disabled>

                        <i class="fa-solid fa-paper-plane"></i>

                    </button>

                </div>

            </section>

        </div>
            </main>

</div>

<!-- ==========================================
     Socket.IO
========================================== -->

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<!-- Put the user loading script HERE -->
<script>

const API_BASE_URL = "https://skillhub-backend-cths.onrender.com/api";

const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "index.html";
}

const logoutBtn = document.getElementById("logoutBtn");

if (logoutBtn) {

    logoutBtn.onclick = () => {

        localStorage.removeItem("token");

        window.location.href = "index.html";

    };

}

async function loadCurrentUser() {

    try {

        const response = await fetch(

            `${API_BASE_URL}/users/me`,

            {

                headers: {

                    Authorization: `Bearer ${token}`

                }

            }

        );

        if (!response.ok) return;

        const user = await response.json();

        document.getElementById("userName").textContent =
            user.name ||
            user.fullName ||
            user.username ||
            "User";

    }

    catch (err) {

        console.log(err);

    }

}

document.addEventListener("DOMContentLoaded", loadCurrentUser);

</script>

<!-- Your chat.js MUST be last -->
<script src="chat.js"></script>

</body>
</html>
