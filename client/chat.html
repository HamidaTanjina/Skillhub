<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SkillHub Chat</title>

    
    <!-- Chat Style -->
    <link rel="stylesheet" href="chat.css">

    <!-- Theme -->
    <link rel="stylesheet" href="theme.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="theme.js" defer></script>

</head>

<body>

<div class="dashboard">

    <!-- ===================================================== -->
    <!-- LEFT SIDEBAR -->
    <!-- ===================================================== -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-graduation-cap"></i>

            <span>SkillHub</span>

        </div>

        <ul>

            <li onclick="window.location.href='dashboard.html'">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </li>

            <li>

                <a href="browse-skills.html">

                    <i class="fa-solid fa-book"></i>

                    Browse Skills

                </a>

            </li>

            <li onclick="window.location.href='request.html'">

                <i class="fa-solid fa-handshake"></i>

                Requests

            </li>

            <li class="active">

                <a href="chat.html">

                    <i class="fa-solid fa-comments"></i>

                    Chat

                </a>

            </li>

            <li onclick="window.location.href='profile.html'">

                <i class="fa-solid fa-user"></i>

                Profile

            </li>

            <li id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </li>

        </ul>

    </aside>

    <!-- ===================================================== -->
    <!-- MAIN CONTENT -->
    <!-- ===================================================== -->

    <main class="main">

        <div class="chat-container">

            <!-- =============================================== -->
            <!-- CHAT SIDEBAR -->
            <!-- =============================================== -->

            <aside class="chat-sidebar">

                <div class="sidebar-header">

                    <h2>

                        <i class="fa-solid fa-comments"></i>

                        Chats

                    </h2>

                </div>

                <div class="search-box">

                    <i class="fa-solid fa-search"></i>

                    <input
                        type="text"
                        id="searchChat"
                        placeholder="Search conversations...">

                </div>

                <div
                    class="chat-list"
                    id="chatList">

                    <!-- Loaded dynamically -->

                </div>

            </aside>
                        <!-- =============================================== -->
            <!-- RIGHT CHAT -->
            <!-- =============================================== -->

            <section class="chat-section">

                <!-- Chat Header -->

                <div class="chat-header">

                    <div class="header-user">

                        <div
                            class="avatar"
                            id="chatAvatar">

                            <i class="fa-solid fa-user"></i>

                        </div>

                        <div class="header-info">

                            <h3 id="chatUser">

                                Select a Chat

                            </h3>

                            <span id="chatStatus">

                                Choose a conversation to start chatting

                            </span>

                        </div>

                    </div>

                </div>

                <!-- Messages -->

                <div
                    class="chat-body"
                    id="chatBody">

                    <div class="empty-chat">

                        <i class="fa-solid fa-comments"></i>

                        <h2>

                            Welcome to SkillHub Chat

                        </h2>

                        <p>

                            Select a conversation from the left sidebar to start
                            chatting with your skill partner.

                        </p>

                    </div>

                </div>

                <!-- Message Input -->

                <div class="chat-input">

                    <button
                        class="emoji-btn"
                        type="button">

                        <i class="fa-regular fa-face-smile"></i>

                    </button>

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Type a message..."
                        disabled>

                    <button
                        class="send-btn"
                        id="sendBtn"
                        type="button"
                        disabled>

                        <i class="fa-solid fa-paper-plane"></i>

                    </button>

                </div>

            </section>

        </div>

    </main>

</div>
<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<!-- Chat Script -->
<script src="chat.js"></script>

</body>

</html>
