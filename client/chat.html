<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SkillHub Chat</title>

    <link
        rel="stylesheet"
        href="chat.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="chat-container">

    <!-- ===================================== -->
    <!-- LEFT SIDEBAR -->
    <!-- ===================================== -->

    <aside class="chat-sidebar">

        <div class="sidebar-header">

            <h2>

                <i class="fa-solid fa-comments"></i>

                Chats

            </h2>

        </div>

        <div class="search-box">

            <i class="fa-solid fa-search"></i>

            <input
                type="text"
                id="searchChat"
                placeholder="Search active chats...">

        </div>

        <!-- Chat List -->

        <div
            class="chat-list"
            id="chatList">

            <!-- Loaded from chat.js -->

        </div>

    </aside>



    <!-- ===================================== -->
    <!-- RIGHT CHAT AREA -->
    <!-- ===================================== -->

    <section class="chat-section">

        <!-- Header -->

        <div class="chat-header">

            <div class="header-user">

                <div
                    class="avatar"
                    id="chatAvatar">

                    ?

                </div>

                <div>

                    <h3 id="chatUser">

                        Select a Chat

                    </h3>

                    <span id="chatStatus">

                        Choose an active skill partner

                    </span>

                </div>

            </div>

        </div>


        <!-- Messages -->

        <div
            class="chat-body"
            id="chatBody">

            <div class="empty-chat">

                <i class="fa-solid fa-comments"></i>

                <h2>

                    SkillHub Chat

                </h2>

                <p>

                    Select an active skill partner from the left to start chatting.

                </p>

            </div>

        </div>


        <!-- Input -->

        <div class="chat-input">

            <button
                class="emoji-btn">

                <i class="fa-regular fa-face-smile"></i>

            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
                disabled>

            <button
                id="sendBtn"
                class="send-btn"
                disabled>

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>

    </section>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script src="chat.js"></script>

</body>

</html>
