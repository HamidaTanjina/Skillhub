<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SkillHub | Requests</title>

    <link rel="stylesheet" href="request.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="sidebar.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="theme.js" defer></script>

</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-graduation-cap"></i>

            <span>SkillHub</span>

        </div>

        <ul>

            <li onclick="location.href='dashboard.html'">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </li>

            <li onclick="location.href='browse-skills.html'">

                <i class="fa-solid fa-book-open"></i>

                Browse Skills

            </li>

            <li class="active">

                <i class="fa-solid fa-handshake"></i>

                Requests

            </li>

            <li onclick="location.href='chat.html'">

                <i class="fa-solid fa-comments"></i>

                Chat

            </li>

            <li onclick="location.href='profile.html'">

                <i class="fa-solid fa-user"></i>

                Profile

            </li>

            <li id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main">

        <!-- Page Header -->

        <div class="page-header">

            <div>

                <h1>

                    Skill Exchange Requests

                </h1>

                <p>

                    Manage all your skill exchange requests from one place.

                </p>

            </div>

        </div>

        <!-- Tabs -->

        <div class="tabs">

            <button
                class="tab-btn active"
                data-tab="sent">

                <i class="fa-solid fa-paper-plane"></i>

                Sent

            </button>

            <button
                class="tab-btn"
                data-tab="received">

                <i class="fa-solid fa-inbox"></i>

                Received

            </button>

            <button
                class="tab-btn"
                data-tab="accepted">

                <i class="fa-solid fa-handshake"></i>

                Active Swaps

            </button>

            <button
                class="tab-btn"
                data-tab="completed">

                <i class="fa-solid fa-circle-check"></i>

                Completed

            </button>

        </div>

        <!-- Requests -->

        <section
            id="requestContainer">

        </section>

    </main>

</div>

<!-- Review Modal -->
<div id="reviewModal" class="review-modal" style="display:none;">

    <div class="review-box">

        <h2>Rate Your Skill Partner</h2>

        <p>How was your learning experience?</p>

        <!-- Star Rating -->
        <div class="star-rating">

            <i class="fa-solid fa-star" data-value="1"></i>
            <i class="fa-solid fa-star" data-value="2"></i>
            <i class="fa-solid fa-star" data-value="3"></i>
            <i class="fa-solid fa-star" data-value="4"></i>
            <i class="fa-solid fa-star" data-value="5"></i>

        </div>

        <!-- Review -->
        <textarea
            id="reviewComment"
            placeholder="Write your review..."
            maxlength="500"></textarea>

        <!-- Recommend -->
        <label class="recommend">

            <input
                type="checkbox"
                id="recommendUser">

            I would recommend this user

        </label>

        <!-- Buttons -->
        <div class="review-actions">

            <button
                class="cancel-review"
                onclick="closeReviewModal()">

                Cancel

            </button>

            <button
                class="submit-review"
                onclick="submitReview()">

                Submit Review

            </button>

        </div>

    </div>

</div>
<script src="request.js"></script>

</body>

</html>
